aid: acheel
name: Acheel
description: 'Acheel is a French digital insurance company — a néo-assureur that carries its own
  insurance licence rather than broking someone else''s. Founded in 2020 by Ralph Ruimy and Francky
  Défossé, it received its ACPR agrément and launched in 2021, and now reports more than 800,000
  policyholders. ACHEEL SA (879 605 350 RCS Paris) underwrites; ACHEEL FRANCE (ORIAS 21003575)
  distributes. The range spans nine lines — habitation, auto, santé, animaux, PNO (propriétaire non
  occupant), emprunteur, scolaire, protection juridique and RC pro — sold 100% digitally, with a
  quote in about two minutes and subscription in five. Roughly 70% of revenue comes from B2B2C
  distribution: partner brokers are served under the Charlee brand (charlee.fr, broker portal "Acheel
  Omega" at back.charlee.fr) and partners embed a per-tenant white-label customer area served from
  *.widget.acheel.com. Acheel''s own partner FAQ stated it makes its APIs available to partners
  ("nous mettons à votre disposition nos APIs afin de vous faire bénéficier de notre Tech et de nos
  produits"), but no developer portal, API reference, base URL or machine-readable specification is
  published anywhere on its public surface; API access travels with a brokerage partnership. Acheel is
  a certified B Corp.'
