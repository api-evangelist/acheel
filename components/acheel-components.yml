summary: >-
  Acheel's real integration surface for partners is a hosted, per-tenant white-label application
  served from *.widget.acheel.com, not a downloadable component library. The public Charlee site
  links a client login at a UUID-keyed subdomain, and that host answers 200 with a Laravel
  application (XSRF-TOKEN + acheel-session cookies) whose response carries
  `content-security-policy: frame-ancestors https://*.acheel.com` — i.e. it is built to be embedded
  in an Acheel-controlled frame, one tenant per subdomain. That is the "marque blanche" / white-label
  distribution Acheel markets to its B2B2C partners and brokers.
status: undocumented
publicly_documented: false
documentation_note: >-
  Nothing here comes from an Acheel integration guide, because none is published. Every field below
  is an observation from a public page or a probed HTTP response, recorded as evidence. There is no
  loader script, no npm package, no documented embed snippet, no configuration reference and no
  versioning for this surface on any public Acheel or Charlee page.
