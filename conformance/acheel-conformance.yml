    evidence: no public securityScheme, no OAuth documentation, and no /.well-known/oauth-authorization-server on any host (404 everywhere)
  - id: oidc
    conforms: unknown
    evidence: /.well-known/openid-configuration returns 404 on every reachable Acheel and Charlee host
  - id: rfc9457-problem-details
    conforms: unknown
