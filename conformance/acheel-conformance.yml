      security.txt on the Intercom-hosted faq.acheel.com help centre — a vendor document, not
      Acheel's (see well-known/acheel-well-known.yml).
  - id: rfc8594-sunset-header
    conforms: unknown
    evidence: no versioning or deprecation policy is published; no API host resolves to observe headers
