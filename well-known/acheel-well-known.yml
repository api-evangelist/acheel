generated: '2026-08-17'
method: probed
source: live probes of /.well-known/ on every Acheel / Charlee host reachable from public pages
checked: '2026-08-17'
summary: >-
  Acheel serves no /.well-known/ discovery document of its own on any host. Every RFC 9116
  security.txt, RFC 8414 / OIDC discovery, api-catalog, ai-plugin and A2A agent-card path returns
  404 on www.acheel.com, v2.acheel.com (the live public site), emprunteur.acheel.com, the
  per-tenant *.widget.acheel.com application host, and on both Charlee hosts (www.charlee.fr
  marketing, back.charlee.fr broker portal). api.acheel.com, developers.acheel.com and
  docs.acheel.com do not resolve in DNS at all.
pointer_basis: >-
  NO WellKnown pointer and NO SecurityTxt pointer emitted. The only 200 on any /.well-known/ path
  in this probe is faq.acheel.com/.well-known/security.txt, and that document is NOT Acheel's — it
  is Intercom's, served because faq.acheel.com is an Intercom-hosted help centre. Its own body says
  so ("reporting security vulnerabilities to Intercom", Contact https://bugcrowd.com/intercom,
  Canonical https://app.intercom.com/.well-known/security.txt). Crediting Acheel with a
  vulnerability-disclosure surface on the strength of its help-desk vendor's security.txt would be
  a false positive, so it is recorded below as a vendor document, not as an Acheel document, and
  is deliberately NOT saved into this directory as acheel-security.txt.
false_positive_watch: >-
  Two shapes to watch on re-runs. (1) The Intercom security.txt above — a 200 on an Acheel-branded
  hostname that belongs to a SaaS vendor. Check the Canonical: line before ever wiring SecurityTxt.
  (2) v2.acheel.com, www.charlee.fr and back.charlee.fr all answer with a styled HTML error page,
  but they return a real 404 status, so no soft-200 credit is at risk here.
